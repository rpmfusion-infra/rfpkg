[rfpkg]
lookaside = https://pkgs.rpmfusion.org/repo/pkgs
lookasidehash = sha512
lookaside_cgi = https://pkgs.rpmfusion.org/repo/pkgs/upload.cgi
gitbaseurl = ssh://%(user)s@pkgs.rpmfusion.org/%(repo)s
anongiturl = https://pkgs.rpmfusion.org/git/%(repo)s
branchre = f\d$|f\d\d$|el\d$|master$
kojiprofile = koji-rpmfusion
build_client = koji-rpmfusion
clone_config =
  bz.default-tracker bugzilla.rpmfusion.org
  bz.default-product Fedora
  bz.default-version rawhide
  bz.default-component %(repo)s
  sendemail.to %(repo)s-owner@rpmfusion.org
distgit_namespaced = True
distgit_namespaces = free nonfree cuda
lookaside_namespaced = True
results_dir=root
lookaside_attempts = 3
lookaside_delay = 15
multilib_pkgs =
    buildsys-build-rpmfusion
    gstreamer1-libav
    gstreamer1-plugins-bad-freeworld
    gstreamer1-plugins-ugly
    fdk-aac
    faad2
    ffmpeg
    libde265
    libdca
    libmms
    libquicktime
    libva-intel-driver
    mjpegtools
    mesa-freeworld
    nvidia-vaapi-driver
    intel-media-driver
    opencore-amr
    rtmpdump
    vo-amrwbenc
    x264
    x265
    xvidcore
    zsnes
    Cg
    dega-sdl
    gens
    pcsx2
    steam
    xorg-x11-drv-nvidia
    xorg-x11-drv-nvidia-580xx
    xorg-x11-drv-nvidia-470xx
    xorg-x11-drv-nvidia-390xx
    xorg-x11-drv-nvidia-340xx
    unace
